services:
  vaultwarden:
    # Pinned deliberately. This holds every credential, so an upgrade is a
    # decision rather than a side effect of a pull. 1.37.0 carries nine security
    # advisories and is the minimum required by Bitwarden clients 2026.7.0+.
    image: vaultwarden/server:1.37.0
    container_name: vaultwarden
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Must match the public URL exactly — WebAuthn, email links and push all
      # derive from it, and a mismatch fails in confusing, indirect ways.
      - DOMAIN=https://vaultwarden.alimunee.com
      # ADMIN_TOKEN, SIGNUPS_* and SMTP_* come straight from env_file rather than
      # being re-declared as ${VAR} here. The admin token is an Argon2 PHC string
      # full of '$' characters, which compose would treat as interpolation and
      # silently mangle; env_file values are passed through literally.
      # Real client IP. All public traffic arrives via the Cloudflare tunnel,
      # which sets CF-Connecting-IP; without this, every request would appear to
      # come from the cloudflared container and share one login rate-limit bucket.
      - IP_HEADER=CF-Connecting-IP
      - IP_HEADER_TRUSTED_PROXIES=local
      # Served on the main port since 1.30 — the old standalone 3012 listener is gone.
      - ENABLE_WEBSOCKET=true
      - SENDS_ALLOWED=true
      - SMTP_TIMEOUT=15
      - LOG_LEVEL=warn
      - EXTENDED_LOGGING=true
      - TZ=Asia/Kuala_Lumpur
    volumes:
      - /storage/data/vaultwarden:/data
      - /etc/localtime:/etc/localtime:ro
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.vaultwarden.rule=Host(`vaultwarden.alimunee.com`)"
      - "traefik.http.routers.vaultwarden.entrypoints=web"
      - "traefik.http.routers.vaultwarden.service=vaultwarden"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
      # TLS terminates at the Cloudflare edge and the tunnel speaks plain HTTP
      # inward, so Vaultwarden has to be told the original scheme and host.
      - "traefik.http.middlewares.vaultwarden-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.vaultwarden-headers.headers.customrequestheaders.X-Forwarded-Host=vaultwarden.alimunee.com"
      - "traefik.http.routers.vaultwarden.middlewares=vaultwarden-headers@docker"
      # No separate /notifications/hub router: Traefik upgrades WebSocket
      # connections on the existing route, and Vaultwarden serves them on :80.
    healthcheck:
      test: ["CMD-SHELL", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

networks:
  proxy:
    external: true
