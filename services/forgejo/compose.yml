services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:${FORGEJO_VERSION:-16.0.4}
    container_name: forgejo
    restart: unless-stopped
    env_file:
    - .env
    environment:
    - TZ=Asia/Kuala_Lumpur
    - USER_UID=1000
    - USER_GID=1000
    # --- instance identity ---
    # APP_NAME must go in the root/DEFAULT section: the image's config template pins
    # it there, and the root value wins over [server] APP_NAME for display.
    - FORGEJO__DEFAULT__APP_NAME=RedRipper Forge
    - FORGEJO__server__APP_NAME=RedRipper Forge
    - FORGEJO__server__DOMAIN=git.alimunee.com
    - FORGEJO__server__ROOT_URL=https://git.alimunee.com/
    - FORGEJO__server__HTTP_PORT=3000
    - FORGEJO__server__SSH_DOMAIN=git.alimunee.com
    - FORGEJO__server__SSH_PORT=2222
    - FORGEJO__server__SSH_LISTEN_PORT=22
    - FORGEJO__server__START_SSH_SERVER=false
    - FORGEJO__server__LFS_START_SERVER=true
    - FORGEJO__server__LFS_JWT_SECRET=${LFS_JWT_SECRET}
    # --- database ---
    - FORGEJO__database__DB_TYPE=postgres
    - FORGEJO__database__HOST=forgejo-db:5432
    - FORGEJO__database__NAME=forgejo
    - FORGEJO__database__USER=forgejo
    - FORGEJO__database__PASSWD=${DB_PASSWORD}
    - FORGEJO__database__SSL_MODE=disable
    # --- secrets / skip web installer ---
    - FORGEJO__security__INSTALL_LOCK=true
    - FORGEJO__security__SECRET_KEY=${SECRET_KEY}
    - FORGEJO__security__INTERNAL_TOKEN=${INTERNAL_TOKEN}
    - FORGEJO__oauth2__JWT_SECRET=${JWT_SECRET}
    # --- access policy: public repos readable anonymously, private by default ---
    - FORGEJO__service__DISABLE_REGISTRATION=true
    - FORGEJO__service__REQUIRE_SIGNIN_VIEW=false
    # DEFAULT_PRIVATE must live in [repository]: with it in [service] (where the example
    # config documents it) the v16 web form left the "Make repository private" box empty.
    - FORGEJO__repository__DEFAULT_PRIVATE=private
    - FORGEJO__service__ENABLE_NOTIFY_MAIL=true
    - FORGEJO__service__REGISTER_EMAIL_CONFIRM=false
    # --- no gravatar pings: member email hashes must not leak to a third party ---
    - FORGEJO__picture__DISABLE_GRAVATAR=true
    - FORGEJO__picture__ENABLE_FEDERATED_AVATAR=false
    # --- mail via the homelab postfix relay (Brevo upstream, SPF fixed) ---
    - FORGEJO__mailer__ENABLED=true
    - FORGEJO__mailer__PROTOCOL=smtp
    - FORGEJO__mailer__SMTP_ADDR=postfix
    - FORGEJO__mailer__SMTP_PORT=25
    - FORGEJO__mailer__FROM=RedRipper Forge <forgejo@alimunee.com>
    - FORGEJO__mailer__ENVELOPE_FROM=forgejo@alimunee.com
    - FORGEJO__mailer__HELO_HOSTNAME=git.alimunee.com
    # --- GitLab-style SSO: Zitadel OIDC, accounts auto-provisioned on first login ---
    - FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION=true
    - FORGEJO__oauth2_client__ACCOUNT_LINKING=auto
    - FORGEJO__oauth2_client__USERNAME=email
    - FORGEJO__oauth2_client__UPDATE_AVATAR=false
    - FORGEJO__oauth2_client__REGISTER_EMAIL_CONFIRM=false
    - FORGEJO__oauth2_client__OPENID_CONNECT_SCOPES=email profile
    # --- Actions ---
    - FORGEJO__actions__ENABLED=true
    - FORGEJO__actions__DEFAULT_ACTIONS_URL=https://code.forgejo.org
    - FORGEJO__actions__LOG_COMPRESSION=zstd
    - FORGEJO__actions__LOG_RETENTION_DAYS=30
    - FORGEJO__actions__ARTIFACT_RETENTION_DAYS=30
    # --- webhooks may target public hosts and internal ones (n8n, ntfy) ---
    - FORGEJO__webhook__ALLOWED_HOST_LIST=external,private
    - FORGEJO__repository__DEFAULT_BRANCH=main
    volumes:
    - /storage/data/forgejo/data:/data
    # Bind-mounted so the nightly `scripts/forgejo-dump.sh` can write into it as uid 1000.
    - /storage/data/forgejo/dumps:/dumps
    - /etc/localtime:/etc/localtime:ro
    ports:
    - "2222:22"
    - "3000:3000"
    dns:
    - 8.8.8.8
    - 1.1.1.1
    networks:
    - proxy
    - forgejo_internal
    labels:
    - traefik.enable=true
    - traefik.http.routers.forgejo.rule=Host(`git.alimunee.com`)
    - traefik.http.services.forgejo.loadbalancer.server.port=3000
    - traefik.docker.network=proxy
    depends_on:
      forgejo-db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:3000/api/healthz
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  forgejo-db:
    image: postgres:16-alpine
    container_name: forgejo-db
    restart: unless-stopped
    env_file:
    - .env
    environment:
    - TZ=Asia/Kuala_Lumpur
    - POSTGRES_USER=forgejo
    - POSTGRES_PASSWORD=${DB_PASSWORD}
    - POSTGRES_DB=forgejo
    - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
    - /storage/data/forgejo/db:/var/lib/postgresql/data
    - /etc/localtime:/etc/localtime:ro
    networks:
    - forgejo_internal
    - db_network
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -d forgejo -U forgejo
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # The runner holds the host Docker socket, so job code is root-equivalent on this
  # machine by design. Mitigation: nothing untrusted may run here - keep public repos from
  # running fork/outside-collaborator jobs (repo Settings -> Actions) or keep them off
  # this instance entirely.
  forgejo-runner:
    image: code.forgejo.org/forgejo/runner:${RUNNER_VERSION:-12}
    container_name: forgejo-runner
    restart: unless-stopped
    depends_on:
      forgejo:
        condition: service_healthy
    environment:
    - TZ=Asia/Kuala_Lumpur
    # Keeps runner state (and the .cache the runner uses) next to the mounted config.
    - HOME=/storage/data/forgejo/runner
    # The image runs as uid 1000 (ali), which is not in the host's docker group, so the
    # socket would be unreadable without this. 987 = gid of /var/run/docker.sock.
    group_add:
    - "987"
    # The image declares no ENTRYPOINT, so the binary must be named explicitly here.
    command: ["/bin/forgejo-runner", "daemon", "--config", "/storage/data/forgejo/runner/config.yaml"]
    volumes:
    # Same-path bind on purpose: the runner writes job workspaces here while job
    # containers - created as siblings by the host daemon - bind-mount the same path.
    # Unlike /data, both sides then see one identical directory.
    - /storage/data/forgejo/runner:/storage/data/forgejo/runner
    - /var/run/docker.sock:/var/run/docker.sock
    - /etc/localtime:/etc/localtime:ro
    networks:
    - forgejo_internal
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

networks:
  proxy:
    external: true
  forgejo_internal:
    name: forgejo_internal
    driver: bridge
  db_network:
    external: true
    name: db_network
