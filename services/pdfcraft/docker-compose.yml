services:
  pdfcraft:
    image: ghcr.io/pdfcrafttool/pdfcraft:latest
    container_name: pdfcraft
    restart: 'no'
    environment:
    - TZ=Asia/Kuala_Lumpur
    volumes:
    - /etc/localtime:/etc/localtime:ro
    dns:
    - 8.8.8.8
    - 1.1.1.1
    networks:
    - proxy
    labels:
    - traefik.enable=true
    - traefik.http.routers.pdfcraft.rule=Host(`pdfcraft.alimunee.com`)
    - traefik.http.services.pdfcraft.loadbalancer.server.port=80
    - traefik.docker.network=proxy
    - traefik.http.middlewares.pdfcraft-sablier.plugin.sablier.sablierUrl=http://sablier:10000
    - traefik.http.middlewares.pdfcraft-sablier.plugin.sablier.sessionDuration=5m
    - traefik.http.middlewares.pdfcraft-sablier.plugin.sablier.group=pdfcraft-stack
    - traefik.http.middlewares.pdfcraft-sablier.plugin.sablier.dynamic.theme=hacker-terminal
    - traefik.docker.allownonrunning=true
    - traefik.http.routers.pdfcraft.middlewares=pdfcraft-sablier
    - sablier.enable=true
    - sablier.group=pdfcraft-stack
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:80/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
networks:
  proxy:
    external: true
